[package]
name = "alfred"
version = "1.0.0"
description = "Alfred — local multi-agent workflow automations"
authors = ["nirzhuk"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "alfred_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
keyring = "4.1.6"
rand = "0.8.7"
reqwest = { version = "0.13.4", features = ["json", "form", "query", "stream"] }
futures-util = { version = "0.3.31", features = ["sink"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10"
jsonwebtoken = "9"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sha2 = "0.10.9"
url = "2.5.8"
zeroize = "1.8.2"
directories = "6.0.0"
cron = { version = "0.17.0", features = ["serde"] }
notify = "8.2.0"
tiny_http = "0.12.0"
tauri-plugin-dialog = "2.7.2"
notify-rust = "4"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom"] }
hmac = "0.12"
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }
wacore = { version = "=0.7.0", default-features = false }
async-trait = "0.1"
bytes = "1"
wacore-appstate = { version = "=0.7.0", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
log = { version = "0.4", features = ["std"] }
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain", "protected"] }
keyring-core = "1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
window-vibrancy = "0.6"
