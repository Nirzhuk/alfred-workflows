[package]
name = "whatsapp-feasibility-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
env_logger = "0.11"
log = "0.4"
qr2term = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client", "signal"] }
