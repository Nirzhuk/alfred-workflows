# Build Alfred desktop installers into a private GitHub Release draft.
#
# Alfred's official binaries are paid. The public repository distributes
# source, not maintainer-signed installers. After verification, maintainers
# copy accepted draft assets to the paid download service. NEVER publish the
# draft GitHub Release.
#
# Primary artifacts for distribution:
#   - macOS: .dmg (also used by the Homebrew cask)
#   - Windows: .exe (NSIS) and .msi
#   - Linux: .AppImage, .deb, .rpm
#
# Triggers:
#   - Manual only: Actions → release → Run workflow (workflow_dispatch)
#     Pick the branch/ref to build from (usually main). Main stays free for
#     day-to-day work; nothing builds or publishes on push.
#
# Signing: macOS Developer ID signing and notarization are required. Windows
# Authenticode signing is explicitly waived for this release, so every Windows
# artifact is an unsigned beta. Updater signatures remain deferred to plan 006.
#
# Repo settings required: Settings → Actions → General → Workflow permissions
# → Read and write permissions (so the job can create/update the GitHub Release).

name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            args: ""
            bundles: deb,rpm,appimage
          - platform: windows-latest
            args: ""
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (Tauri action helper)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "$required secret is required for signed macOS releases"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          trap 'rm -f certificate.p12' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then
            echo "Could not find a Developer ID Application identity after import"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required macOS code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signatures (optional until keys exist)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Alfred v__VERSION__
          releaseBody: |
            PRIVATE STAGING DRAFT — DO NOT PUBLISH TO THE PUBLIC REPOSITORY.

            Candidate official desktop installers for paid distribution:

            - **macOS:** `.dmg` for Apple Silicon and Intel
            - **Windows beta:** unsigned `.exe` (NSIS) and `.msi`; Windows will report an unknown publisher and may show a SmartScreen warning
            - **Linux:** `.AppImage`, `.deb`, and `.rpm`

            Alfred shells out to local agent CLIs (Claude Code, Cursor, Codex, OpenCode). Install and authenticate those on the machine before running workflows.

            Follow docs/releasing.md: test these exact assets, generate checksums, and upload accepted files to the paid download service. Never convert this draft into a public GitHub Release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - name: Notarize, staple, and replace macOS DMG
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}"
            exit 1
          fi

          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"

          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "v${version}" "${dmgs[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-macos-installers:
    name: Verify downloaded macOS installer (${{ matrix.arch }})
    needs: publish-tauri
    permissions:
      # GitHub only exposes draft releases to tokens with push-level access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            expected_arch: arm64
          - platform: macos-15-intel
            arch: x64
            expected_arch: x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download exact draft DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          asset_name="Alfred_${version}_${{ matrix.arch }}.dmg"
          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${version}\") | .id" | head -1)
          if [ -z "$release_id" ]; then
            echo "Draft release v${version} was not found"
            exit 1
          fi

          asset_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$asset_name\") | .id" | head -1)
          if [ -z "$asset_id" ]; then
            echo "Draft asset $asset_name was not found"
            exit 1
          fi

          dmg_path="$release_dir/$asset_name"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Verify, install, and launch twice
        run: |
          hdiutil verify "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          mount_point="$RUNNER_TEMP/alfred-mount"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$DMG_PATH"

          codesign --verify --deep --strict --verbose=2 "$mount_point/Alfred.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Alfred.app"

          actual_arch=$(lipo -archs "$mount_point/Alfred.app/Contents/MacOS/workflows-local-agents")
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected ${{ matrix.expected_arch }}, found $actual_arch"
            exit 1
          fi

          ditto "$mount_point/Alfred.app" /Applications/Alfred.app
          codesign --verify --deep --strict --verbose=2 /Applications/Alfred.app
          spctl --assess --type execute --verbose=4 /Applications/Alfred.app

          launch_and_quit() {
            open -n /Applications/Alfred.app
            for _ in {1..20}; do
              if [ "$(osascript -e 'application id "com.nirzhuk.alfred" is running')" = "true" ]; then
                osascript -e 'tell application id "com.nirzhuk.alfred" to quit'
                return 0
              fi
              sleep 1
            done
            echo "Alfred did not launch within 20 seconds"
            return 1
          }

          launch_and_quit
          launch_and_quit

      - name: Uninstall and detach test DMG
        if: always()
        run: |
          osascript -e 'tell application id "com.nirzhuk.alfred" to quit' 2>/dev/null || true
          rm -rf /Applications/Alfred.app
          hdiutil detach "$RUNNER_TEMP/alfred-mount" 2>/dev/null || true

  verify-windows-installer:
    name: Verify downloaded unsigned Windows installer
    needs: publish-tauri
    permissions:
      # GitHub only exposes draft releases to tokens with push-level access.
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download, install, and launch twice
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $installerName = "Alfred_${version}_x64-setup.exe"
          $installer = Join-Path $releaseDir $installerName

          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list GitHub Releases"
          }
          $release = $releases |
            Where-Object { $_.draft -and $_.tag_name -eq "v${version}" } |
            Select-Object -First 1
          if (-not $release) {
            throw "Draft release v${version} was not found"
          }

          $asset = $release.assets |
            Where-Object { $_.name -eq $installerName } |
            Select-Object -First 1
          if (-not $asset) {
            throw "Draft asset $installerName was not found"
          }

          Invoke-WebRequest `
            -Uri $asset.url `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected the waived Windows beta to be unsigned, found $($signature.Status)"
          }

          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with $($install.ExitCode)"
          }

          $executable = Join-Path $env:LOCALAPPDATA 'Alfred\workflows-local-agents.exe'
          if (-not (Test-Path $executable)) {
            throw "Installed executable not found at $executable"
          }

          function Test-AlfredLaunch {
            $process = Start-Process -FilePath $executable -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Alfred exited during launch with code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }

          Test-AlfredLaunch
          Test-AlfredLaunch

          $uninstaller = Join-Path (Split-Path $executable) 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with $($uninstall.ExitCode)"
          }
          if (Test-Path $executable) {
            throw "Alfred executable remains after uninstall"
          }
