# Build Alfred desktop installers into a private GitHub Release draft.
#
# Alfred's official binaries are paid. The public repository distributes
# source, not maintainer-signed installers. After verification, maintainers
# copy accepted draft assets to the paid download service. NEVER publish the
# draft GitHub Release.
#
# Primary artifacts for distribution:
#   - macOS: .dmg (also used by the Homebrew cask)
#   - Windows: .exe (NSIS) and .msi
#   - Linux: .AppImage, .deb, .rpm
#
# Triggers:
#   - Manual only: Actions → release → Run workflow (workflow_dispatch)
#     Pick the branch/ref to build from (usually main). Main stays free for
#     day-to-day work; nothing builds or publishes on push.
#
# Signing: macOS Developer ID signing and notarization are required. Windows
# Authenticode signing is explicitly waived for this release, so every Windows
# artifact is an unsigned beta.
#
# There is no automatic updater. v0.5.0 customers download manually from Polar's
# File Downloads benefit, so `uploadUpdaterJson` stays false and no updater
# plugin, key, or manifest exists.
#
# Gates:
#   - verify-version rejects a version mismatch across package.json,
#     src-tauri/Cargo.toml, and src-tauri/tauri.conf.json.
#   - acceptance-manifest rejects a missing or duplicated required artifact and
#     emits a text + JSON acceptance manifest (version, source commit,
#     filenames, sizes, architectures, SHA-256). It never records a secret.
#
# Repo settings required: Settings → Actions → General → Workflow permissions
# → Read and write permissions (so the job can create/update the GitHub Release).

name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify version alignment
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require one version across all three release files
        id: versions
        run: |
          set -euo pipefail
          package_version=$(jq -er '.version' package.json)
          tauri_version=$(jq -er '.version' src-tauri/tauri.conf.json)
          cargo_version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"|".*/, "")
              print
              exit
            }
          ' src-tauri/Cargo.toml)

          echo "package.json          $package_version"
          echo "src-tauri/Cargo.toml  $cargo_version"
          echo "src-tauri/tauri.conf.json $tauri_version"

          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read [package] version from src-tauri/Cargo.toml"
            exit 1
          fi
          if [ "$package_version" != "$cargo_version" ] || [ "$package_version" != "$tauri_version" ]; then
            echo "::error::Release version mismatch. All three files must agree before a release build."
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            args: ""
            bundles: deb,rpm,appimage
          - platform: windows-latest
            args: ""
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (Tauri action helper)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Import Apple Developer certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "$required secret is required for signed macOS releases"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          trap 'rm -f certificate.p12' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then
            echo "Could not find a Developer ID Application identity after import"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required macOS code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Alfred v__VERSION__
          releaseBody: |
            PRIVATE STAGING DRAFT — DO NOT PUBLISH TO THE PUBLIC REPOSITORY.

            Candidate official desktop installers for paid distribution:

            - **macOS:** `.dmg` for Apple Silicon and Intel
            - **Windows beta:** unsigned `.exe` (NSIS) and `.msi`; Windows will report an unknown publisher and may show a SmartScreen warning
            - **Linux:** `.AppImage`, `.deb`, and `.rpm`

            Alfred shells out to local agent CLIs (Claude Code, Cursor, Codex, OpenCode). Install and authenticate those on the machine before running workflows.

            Follow docs/releasing.md: test these exact assets, generate checksums, and upload accepted files to the paid download service. Never convert this draft into a public GitHub Release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - name: Notarize, staple, and replace macOS DMG
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}"
            exit 1
          fi

          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"

          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release upload "v${version}" "${dmgs[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-macos-installers:
    name: Verify downloaded macOS installer (${{ matrix.arch }})
    needs: publish-tauri
    permissions:
      # GitHub only exposes draft releases to tokens with push-level access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            expected_arch: arm64
          - platform: macos-15-intel
            arch: x64
            expected_arch: x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download exact draft DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          asset_name="Alfred_${version}_${{ matrix.arch }}.dmg"
          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${version}\") | .id" | head -1)
          if [ -z "$release_id" ]; then
            echo "Draft release v${version} was not found"
            exit 1
          fi

          asset_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$asset_name\") | .id" | head -1)
          if [ -z "$asset_id" ]; then
            echo "Draft asset $asset_name was not found"
            exit 1
          fi

          dmg_path="$release_dir/$asset_name"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Verify, install, and launch twice
        run: |
          hdiutil verify "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          mount_point="$RUNNER_TEMP/alfred-mount"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$DMG_PATH"

          codesign --verify --deep --strict --verbose=2 "$mount_point/Alfred.app"
          spctl --assess --type execute --verbose=4 "$mount_point/Alfred.app"

          actual_arch=$(lipo -archs "$mount_point/Alfred.app/Contents/MacOS/alfred")
          if [ "$actual_arch" != "${{ matrix.expected_arch }}" ]; then
            echo "Expected ${{ matrix.expected_arch }}, found $actual_arch"
            exit 1
          fi

          ditto "$mount_point/Alfred.app" /Applications/Alfred.app
          codesign --verify --deep --strict --verbose=2 /Applications/Alfred.app
          spctl --assess --type execute --verbose=4 /Applications/Alfred.app

          launch_and_quit() {
            open -n /Applications/Alfred.app
            for _ in {1..20}; do
              if [ "$(osascript -e 'application id "com.nirzhuk.alfred" is running')" = "true" ]; then
                osascript -e 'tell application id "com.nirzhuk.alfred" to quit'
                return 0
              fi
              sleep 1
            done
            echo "Alfred did not launch within 20 seconds"
            return 1
          }

          launch_and_quit
          launch_and_quit

      - name: Uninstall and detach test DMG
        if: always()
        run: |
          osascript -e 'tell application id "com.nirzhuk.alfred" to quit' 2>/dev/null || true
          rm -rf /Applications/Alfred.app
          hdiutil detach "$RUNNER_TEMP/alfred-mount" 2>/dev/null || true

  verify-windows-installer:
    name: Verify downloaded unsigned Windows installer
    needs: publish-tauri
    permissions:
      # GitHub only exposes draft releases to tokens with push-level access.
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download, install, and launch twice
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $installerName = "Alfred_${version}_x64-setup.exe"
          $installer = Join-Path $releaseDir $installerName

          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list GitHub Releases"
          }
          $release = $releases |
            Where-Object { $_.draft -and $_.tag_name -eq "v${version}" } |
            Select-Object -First 1
          if (-not $release) {
            throw "Draft release v${version} was not found"
          }

          $asset = $release.assets |
            Where-Object { $_.name -eq $installerName } |
            Select-Object -First 1
          if (-not $asset) {
            throw "Draft asset $installerName was not found"
          }

          Invoke-WebRequest `
            -Uri $asset.url `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -OutFile $installer

          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected the waived Windows beta to be unsigned, found $($signature.Status)"
          }

          $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with $($install.ExitCode)"
          }

          $executable = Join-Path $env:LOCALAPPDATA 'Alfred\alfred.exe'
          if (-not (Test-Path $executable)) {
            throw "Installed executable not found at $executable"
          }

          function Test-AlfredLaunch {
            $process = Start-Process -FilePath $executable -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Alfred exited during launch with code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }

          Test-AlfredLaunch
          Test-AlfredLaunch

          $uninstaller = Join-Path (Split-Path $executable) 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with $($uninstall.ExitCode)"
          }
          if (Test-Path $executable) {
            throw "Alfred executable remains after uninstall"
          }

  acceptance-manifest:
    name: Build the release acceptance manifest
    needs:
      - verify-version
      - publish-tauri
      - verify-macos-installers
      - verify-windows-installer
    permissions:
      # GitHub only exposes draft releases to tokens with push-level access.
      contents: write
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      # The required paid artifacts for this release line. Linux packages and the
      # Windows .msi stay best-effort: they are recorded but never required, so
      # they cannot be silently promoted to a supported paid download.
      - name: Download and hash the required draft artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/acceptance"
          mkdir -p "$work"

          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id" | head -1)
          if [ -z "$release_id" ]; then
            echo "::error::Draft release v${VERSION} was not found"
            exit 1
          fi

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | {name, id, size}' | jq -s '.' > "$work/assets.json"

          # filename|platform|architecture|signing
          required="Alfred_${VERSION}_aarch64.dmg|macos|arm64|developer-id-signed-notarized-stapled
          Alfred_${VERSION}_x64.dmg|macos|x86_64|developer-id-signed-notarized-stapled
          Alfred_${VERSION}_x64-setup.exe|windows|x86_64|unsigned-beta"

          : > "$work/required.jsonl"
          failed=0
          while IFS='|' read -r name platform arch signing; do
            name=$(echo "$name" | xargs)
            [ -z "$name" ] && continue

            matches=$(jq --arg n "$name" '[.[] | select(.name == $n)] | length' "$work/assets.json")
            if [ "$matches" -eq 0 ]; then
              echo "::error::Required artifact $name is missing from draft release v${VERSION}"
              failed=1
              continue
            fi
            if [ "$matches" -gt 1 ]; then
              echo "::error::Required artifact $name appears $matches times in draft release v${VERSION}"
              failed=1
              continue
            fi

            asset_id=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' "$work/assets.json")
            path="$work/$name"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$path"

            size=$(stat -c '%s' "$path")
            recorded_size=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .size' "$work/assets.json")
            if [ "$size" != "$recorded_size" ]; then
              echo "::error::$name downloaded as $size bytes but the draft records $recorded_size"
              failed=1
              continue
            fi

            checksum=$(sha256sum "$path" | cut -d' ' -f1)
            jq -nc \
              --arg filename "$name" \
              --arg platform "$platform" \
              --arg architecture "$arch" \
              --arg signing "$signing" \
              --argjson sizeBytes "$size" \
              --arg sha256 "$checksum" \
              '{filename: $filename, platform: $platform, architecture: $architecture, signing: $signing, sizeBytes: $sizeBytes, sha256: $sha256}' \
              >> "$work/required.jsonl"
          done <<< "$required"

          if [ "$failed" -ne 0 ]; then
            echo "::error::The draft release does not contain exactly one copy of every required artifact"
            exit 1
          fi

          jq -s '.' "$work/required.jsonl" > "$work/required.json"

          jq --slurpfile req "$work/required.json" \
            '[.[] | select(.name as $n | ($req[0] | map(.filename) | index($n)) | not)
                  | {filename: .name, sizeBytes: .size}]' \
            "$work/assets.json" > "$work/best-effort.json"

          echo "WORK_DIR=$work" >> "$GITHUB_ENV"

      - name: Write the acceptance manifest
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/manifest"
          mkdir -p "$out"

          jq -n \
            --arg version "$VERSION" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile requiredArtifacts "$WORK_DIR/required.json" \
            --slurpfile bestEffortArtifacts "$WORK_DIR/best-effort.json" \
            '{
              schemaVersion: 1,
              kind: "alfred-release-acceptance-manifest",
              version: $version,
              sourceCommit: $sourceCommit,
              sourceRef: $sourceRef,
              generatedAt: $generatedAt,
              workflowRun: $workflowRun,
              draftRelease: {tag: ("v" + $version), published: false},
              distribution: "polar-file-downloads-manual",
              automaticUpdates: false,
              uploadUpdaterJson: false,
              requiredArtifacts: $requiredArtifacts[0],
              bestEffortArtifacts: $bestEffortArtifacts[0]
            }' > "$out/acceptance-manifest.json"

          {
            echo "Alfred v$VERSION release acceptance manifest"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Source ref:    $GITHUB_REF"
            echo "Generated at:  $(jq -r '.generatedAt' "$out/acceptance-manifest.json")"
            echo "Workflow run:  $(jq -r '.workflowRun' "$out/acceptance-manifest.json")"
            echo "Draft release: v$VERSION (never published)"
            echo "Distribution:  Polar File Downloads, manual updates, no updater"
            echo
            echo "Required paid artifacts"
            echo "-----------------------"
            jq -r '.requiredArtifacts[]
                   | "  \(.filename)\n    platform:     \(.platform)\n    architecture: \(.architecture)\n    signing:      \(.signing)\n    size:         \(.sizeBytes) bytes\n    sha256:       \(.sha256)\n"' \
              "$out/acceptance-manifest.json"
            echo "Best-effort artifacts (not a supported paid download)"
            echo "----------------------------------------------------"
            jq -r 'if (.bestEffortArtifacts | length) == 0
                   then "  none"
                   else (.bestEffortArtifacts[] | "  \(.filename) — \(.sizeBytes) bytes")
                   end' \
              "$out/acceptance-manifest.json"
            echo
            echo "SHA-256 checksums"
            echo "-----------------"
            jq -r '.requiredArtifacts[] | "\(.sha256)  \(.filename)"' \
              "$out/acceptance-manifest.json"
          } > "$out/acceptance-manifest.txt"

          cat "$out/acceptance-manifest.txt"
          cat "$out/acceptance-manifest.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "MANIFEST_DIR=$out" >> "$GITHUB_ENV"

      - name: Upload the acceptance manifest
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-manifest
          path: ${{ env.MANIFEST_DIR }}
          if-no-files-found: error
